name: Initial Deploy

on:
  workflow_dispatch:

jobs:
  deploy-winget-repo:
    name: Deploy to Azure Static Web Apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      
      - name: Setup Node.js (for SWA CLI)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      
      - name: Install Azure Static Web Apps CLI
        run: npm install -g @azure/static-web-apps-cli
      
      - name: Prepare site
        run: |
          mkdir -p winget-repo/_site
          cp winget-repo/index.html winget-repo/_site/
          cp winget-repo/index.json winget-repo/_site/
          cp winget-repo/source.json winget-repo/_site/
          cp winget-repo/staticwebapp.config.json winget-repo/_site/
          cp -r winget-repo/packageManifests winget-repo/_site/
          cp -r winget-repo/manifests winget-repo/_site/
      
      - name: Deploy to Azure SWA
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "winget-repo/_site"
          skip_app_build: true
      
      - name: Comment success
        run: |
          echo "Winget repository deployed to: https://${{ secrets.AZURE_SWA_HOSTNAME }}"
